# ============================================================================
# SKAxx2 定时任务表（迁移自老项目 events/e_Scheduler.py）
# ----------------------------------------------------------------------------
# 老实现：每分钟轮询一次，命中时间点则触发 —— 抖动大、浪费唤醒。
# 新实现：scheduler 插件按 cron 风格精确计算「下一次触发时间」，到点才发事件。
#
# 字段说明：
#   name    任务名，作为事件 payload 里的 task，供 Mind 路由（见心跳事件路径）
#   at      触发时刻 "HH:MM"（本地时区）；每日重复
#   cron    （可选）更细粒度表达式 "分 时 日 月 周"，与 at 二选一
#   payload 触发时随事件一起投递的文本，会作为 system_event 喂给 Mind
#   enabled 是否启用
#
# 测试建议：把 at 改成「当前时间 +1 分钟」，保存后重启进程即可验证触发。
# ============================================================================

tasks:
  - name: "morning_greeting"
    at: "08:30"
    payload: "早上了，看看要不要跟他说句早安。"
    enabled: false        # 默认关闭，避免打扰；需要时改 true

  - name: "night_check"
    at: "22:30"
    payload: "快到他平时睡觉的点了，关心一下。"
    enabled: false

  - name: "self_reflection"
    cron: "0 3 * * *"     # 每天凌晨 3 点：让 Mind 做一次自发反思
    payload: "安静下来了，回顾一下最近的对话。"
    enabled: false