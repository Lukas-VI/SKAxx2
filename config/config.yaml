# ============================================================================
# SKAxx2 主配置
# ----------------------------------------------------------------------------
# 本文件是「声明式装配表」：main.py 读它决定启用哪些渠道/工具/插件。
# 新增功能不需要改内核代码，只在这里加一行名字即可（见方案「可拓展性」）。
# ============================================================================

# ---------------------------------------------------------------------------
# 心跳节拍
# ---------------------------------------------------------------------------
bpm: 6                 # 每分钟心跳次数。beat.py 据此算超时 = 60 / bpm（秒）
                       # 6 → 每 10 秒一次心跳超时；调大更活跃，调小更省 LLM 调用

# ---------------------------------------------------------------------------
# 人设分档（配合 config/persona.yaml）
# ---------------------------------------------------------------------------
persona:
  profile: local_full  # local_full=本地全量人设；cloud_safe=接云端 API 的温和版

# ---------------------------------------------------------------------------
# LLM 网关（OpenAI 兼容协议，Ollama / DeepSeek / 任意兼容服务均可）
# ---------------------------------------------------------------------------
llm:
  base_url: "http://localhost:11434/v1"   # Ollama 默认 OpenAI 兼容端点
  api_key: "ollama"                        # Ollama 无需真实 key，占位即可
  model: "qwen2.5:7b"                      # 本地模型名；换 DeepSeek 时改这里
  temperature: 0.8
  max_tokens: 102400
  timeout: 3000                             # 单次 LLM 调用超时（秒），用 asyncio.timeout 包裹。
                                           # 思考模型（reasoner/本地大模型）生成很慢，60 常不够；
                                           # 若报「调用超时」而非「无法连接」，就是这里太小。
  retry: 1                                 # 结构化解析失败后的重试次数（方案要求「重试一次」）

# ---------------------------------------------------------------------------
# 渠道（Channel）：消息进出口。可多选，逐个由 io 层加载
# ---------------------------------------------------------------------------
channels: [cli, qq, webchat]    # cli 便于本地开发；qq 走 SnowLuma 适配器；webchat 是 WebUI 在线聊天

cli:
  prompt: "你> "       # CLI 输入提示符

# ---------------------------------------------------------------------------
# 在线聊天（WebUI 渠道，阶段三 §2；决策 E1/E2/E3）
# ---------------------------------------------------------------------------
# 与 cli / qq 平级的一个渠道：白送记忆、等级权限、心跳投递与 MindLine 追踪。
# 多开会话共享长期记忆/画像/权限，但每个会话可单独设 persist=false（沙盒，不落库）。
webchat:
  enabled: true                        # 是否启用在线聊天页
  user: "owner"                        # 在线聊天代表的聊天用户身份（决定权限等级与记忆归属）
  identity: "owner"                    # 同上（新键，优先于 user）
  persist: true                        # 新建会话默认是否落库（false=沙盒，可在会话里单独改）
  poll_ms: 1000                        # 前端轮询间隔（毫秒；决策 E2：默认 1 秒）
  compress_at: 0.8                     # 上下文占用达到该比例即触发压缩 + 记忆整理（§3.3）
  context_window: 0                    # 本渠道覆盖模型窗口（0 = 跟随当前提供商）

# ---------------------------------------------------------------------------
# QQ 适配器（默认 SnowLuma，OneBot v11 over HTTP，见方案 §5.4 / 决策 D3）
# ---------------------------------------------------------------------------
# 收事件：SnowLuma 的 httpClients 把事件 POST 到本机 web.event_path（见下），
#         由 Web 线程桥回事件循环 → QQChannel.on_event；
# 发信  ：走 SnowLuma 的 httpServers（HTTP POST send_group_msg / send_private_msg）。
#
# 说明：这些值只是「首次启动的初值」，之后可在后台「绑定 QQ」页热改
#       （后台改动写进 data/admin.db 的 settings 覆盖层，不改本文件）。
qq:
  enabled: true                        # 已部署 SnowLuma，启用 QQ 渠道
  transport: http                      # http（默认）| ws（本阶段仅留接口，未实现）
  api_base: "http://127.0.0.1:3000"    # SnowLuma httpServers 地址（默认 3000）
  access_token: ""                     # SnowLuma 的鉴权 token（Bearer），可留空
  event_path: "/onebot/events"         # 事件上报路径（WebUI 的接收入口）
  report_token: ""                     # 事件上报校验令牌（可留空，仅本机监听）
  self_id: 0                           # 机器人 QQ 号（0 = 启动后自动探测补全）
  default_group: ""                    # 主动发言默认群号（可在后台白名单里细配）
  default_user: ""                     # 私聊默认对象 user_id
  reconnect_min: 1                     # 重连退避起始秒数（指数增长）
  reconnect_max: 60                    # 重连退避上限秒数
  # --- 自动启动 SnowLuma（阶段三增强）---
  # 开启后：只要 qq.enabled=true，启动时会先探测 api_base；
  #   探测不到 → 按 snowluma_command 拉起它，最多等 startup_timeout 秒就绪；
  #   已经能连通 → 直接复用，绝不重复启动（避免抢端口）。
  # 退出/停用/关闭 auto_start 时，只会关掉「本进程自己拉起」的实例。
  auto_start: true                     # 是否在启用 QQ 时自动拉起 SnowLuma
  # 这里直接用发行包自带的 node.exe，避免依赖 PATH 里的 node，也绕开 launcher.bat 的 pause
  snowluma_command: "D:/py/SKA/SnowLuma/node.exe D:/py/SKA/SnowLuma/index.mjs"
  snowluma_cwd: "D:/py/SKA/SnowLuma"   # 启动工作目录（config/ 等相对路径基于此）
  snowluma_webui_port: 5099            # SnowLuma WebUI 端口（已启动但未登录时避免重复拉起）
  startup_timeout: 60                  # 拉起后等待 HTTP API 就绪的秒数

# ---------------------------------------------------------------------------
# WebUI 管理后台（零依赖：标准库 http.server + 原生单页，见方案 §5.3 / 决策 D1/D5）
# ---------------------------------------------------------------------------
web:
  enabled: true                        # 是否随主进程启动后台
  host: "127.0.0.1"                    # 只监听本机（不暴露局域网）
  port: 5098                           # 默认端口（避开 SnowLuma 的 5099）
  session_hours: 72                    # 会话有效期（小时）

# ---------------------------------------------------------------------------
# 工具（Tool）：AgentLoop 可调用的能力。名字对应 @tool("name") 注册项
# ---------------------------------------------------------------------------
tools:
  - time          # 当前时间（第一期验证用）
  - calculator    # 四则运算（安全 AST 求值）
  - fetch         # 抓网页正文（httpx，截断防注入）
  - memory_ops    # 记忆读写（第三期）
  - code_read     # 编码智能体（阶段三 3D）：读文件（受 code 小节白名单约束）
  - code_write    #                          写文件
  - code_run      #                          执行命令（终端可用；带沙盒 + 超时）
  - plugin_ops    # 插件自举：读写/热重载/启停/删除插件（写 ska/plugins 下单文件插件）
  - image_send    # 图片 IO（阶段四）：把本地路径/URL 的图片附到本轮回复里一起发出
  - giphy_search  # 联网检索 GIF（阶段四）：本地表情包没有合适的动图时用
  # 注：MCP 外部工具不在此列——它们由运行期从 mcp.servers 动态发现并合入工具表。

# ---------------------------------------------------------------------------
# 编码智能体三级工具（阶段三 §5 / 3D）：已启用（终端命令可用）
# ---------------------------------------------------------------------------
# ska/tools/code.py 提供 code_read / code_write / code_run。它们能「用代码与真实世界
# 联动」，风险最高，故全程受三重护栏（启用闸 / 等级闸 / 路径白名单）+ 沙盒约束：
#   * 路径必须落在 allow_dirs 白名单内（含子目录，越界即拒）；
#   * 沙盒清洗环境变量（不把 *_API_KEY 之类交给命令）+ 危险命令黑名单（rm -rf / mkfs …）；
#   * 命令有超时，所有输出统一截断（防爆窗 / prompt 注入）。
# 想彻底关闭：把本小节 enabled 改回 false（或把上面 tools 里三行注释掉）。
# 想更严：后台「智能体权限」页把对应工具的最小可用等级设为 admin。
code:
  enabled: true                        # 总闸：已开启（终端命令可用）；改回 false 即全局禁用
  allow_dirs: ["D:/py/SKA/SKAxx2/ska/plugins", "E:/SKA-sandbox", "C:/Users/lupo/Pictures/meme"]                    # 工作目录白名单：相对路径按**项目根**解析，"." 即项目根
                                       #   也可填绝对路径，如 ["D:/workdir"]；为空则一律拒绝执行
  timeout: 10                          # code_run 单条命令超时（秒）
  sandbox: true                        # 沙盒：清洗环境变量 + 危险命令黑名单（默认开，建议保持）
  allow_env: []                        # 额外允许透传给命令的环境变量名（默认只透传 PATH 等系统必需项）
                                       #   例：["JAVA_HOME", "NODE_PATH"]；切勿把 *_API_KEY 之类放进来

# ---------------------------------------------------------------------------
# MCP（Model Context Protocol）外部工具接入（阶段三 §5 增强）：默认关闭
# ---------------------------------------------------------------------------
# 由 ska/mcp/ 用标准库实现极简 MCP 客户端（stdio / JSON-RPC 2.0），把外部 MCP 服务器
# 暴露的工具自动包装成本机 Tool 并合入 AgentLoop，无需安装官方 mcp SDK。
# 启动时后台逐个拉起 servers；单个服务器失败只记日志，不影响主链。
# 注意：MCP 工具默认按 admin 级权限对待（外部能力不可预知），需在「智能体权限」页放行。
mcp:
  enabled: false               # 总闸：默认关闭
  timeout: 30                  # 单次 MCP 请求超时（秒）
  servers: []                  # 服务器列表；每项：name / command / args / env / cwd / enabled
  # 示例（取消注释，并确保本机已具备对应命令）：
  # servers:
  #   - name: filesystem
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "D:/workdir"]
  #     env: {}
  #     enabled: true

# ---------------------------------------------------------------------------
# 插件（Plugin）：订阅总线的横切能力，暴露 install(bus, cfg)
# ---------------------------------------------------------------------------
plugins:
  - filter        # 违禁词过滤（订阅 output 事件，迁移老 message_filter）
  - scheduler     # 定时唤醒（迁移老 e_Scheduler，改精确计时）

# ---------------------------------------------------------------------------
# 主动路径三重闸（仅约束「心跳主动发言」，用户消息永不拦截）
# ---------------------------------------------------------------------------
throttle:
  active_hours: [8, 23]        # 允许主动发言的小时区间 [起, 止)，跨午夜安全
  proactive_max_per_min: 2     # 每分钟主动发言上限（滑窗计数）
  max_silent_beats: 10         # 连续沉默达到该次数后，临时降频跳过主动发言
  backoff_factor: 2            # 静默退避时的降频倍数（间隔 × 该值）
  send_fail_limit: 3           # 发送连续失败次数，达到则熔断，等重连事件恢复

# ---------------------------------------------------------------------------
# 对话窗口（消息批处理）
# ---------------------------------------------------------------------------
# 模型推理一条消息期间，同一聊天里可能又来了好几条消息。开启后这些小消息
# 会在下一轮合并成「一批」一次性输入（文字按行拼接、图片合并后分批解析），
# 只推理、只回复一次，避免在高频群里一句接一句永远追不上。
dialog:
  batch_enabled: true           # 是否开启对话窗口合并（关闭=逐条处理，旧行为）
  batch_max_messages: 12        # 一批最多保留最近多少条（超出丢最旧，避免无限补课）

# ---------------------------------------------------------------------------
# 记忆（第三期）
# ---------------------------------------------------------------------------
memory:
  db_path: "data/ska.db"       # SQLite 文件（WAL 模式）
  working_window: 20           # 工作记忆保留的最近消息条数（老项目无限增长→此处定窗）
  session_max_msgs: 30         # 会话消息数达到该值触发摘要
  session_idle_min: 30         # 会话空闲分钟数达到该值触发摘要
  recall_top_k: 5              # 长期记忆召回条数
  recall_half_life_days: 30    # 时间衰减半衰期（exp(-Δt/30d)）
  core_limit: 8                # 核心记忆常驻条数（始终注入决策提示词，不占检索配额）
  facts_top_k: 4               # 结构化事实召回条数（Mem0 风格三元组，去重后）

# ---------------------------------------------------------------------------
# 图片 IO 与本地表情包库（阶段四）
# ---------------------------------------------------------------------------
# 两条链路共用这一小节：
#   来图：QQ image/mface 段 → 下载 → sha256 去重 → 视觉解析 → 表情包入库（普通照片只描述）
#   发图：Mind/工具给出的本地路径或 URL → 渠道组装 OneBot image 段（本地转 base64://）
media:
  vision_enabled: true          # 是否启用视觉解析（关掉=只收集元数据，不做模型解析）
  vision_model: ""              # 视觉模型名；空=复用主网关（主模型需支持图片输入）
  vision_base_url: ""           # 视觉端点；空=跟随主网关
  vision_api_key: ""            # 视觉端点密钥；空=跟随主网关
  vision_max_tokens: 1200       # 视觉回答的 token 上限（思考型模型会先耗 token 推理，给小了会空回复）
  max_image_bytes: 5242880      # 单张图片最大字节数（5MB），超过拒收
  max_images_per_message: 4     # 每条消息最多解析/发送几张图（防刷图拖垮一轮推理）
  sticker_dir: "data/stickers"  # 表情包落盘目录（相对路径按项目根解析；自动加入发送白名单）
  sticker_catalog_size: 12      # 决策提示词里最多列出多少个表情包的含义摘要
  allow_dirs:                   # 允许发送的本地目录白名单（为空=只允许 URL 与表情包目录）
    - "E:/SKA-sandbox"
    - "data/out"
    - "D:/py/SKA/SKAxx2/ska/plugins"
    - "C:/Users/lupo/Pictures/meme"
  giphy_api_key: ""             # Giphy 检索密钥（https://developers.giphy.com/；空=该工具只提示未配置）

# ---------------------------------------------------------------------------
# 执行者（AgentLoop）与工具总开关（阶段二「智能体权限」页可热改）
# ---------------------------------------------------------------------------
agent:
  allow_tools: true            # 全局是否允许调用工具（关掉则 AgentLoop 一步不用工具）
  max_steps: 100                 # 单轮工具链最大步数（防「模型自循环」失控）

# ---------------------------------------------------------------------------
# 聊天用户等级规则（阶段二「权限管理」页可热改，见方案 §5.7 / 决策 D6）
# ---------------------------------------------------------------------------
# 优先级：owner_user（按 QQ 号钦定） > data/admin.db 的 chat_users 记录 > default_level
roles:
  owner_user: "owner"          # 被视为 owner 等级的聊天用户 id；此处对齐 webchat 的默认身份 owner
  default_level: "member"      # 未登记用户/未指定时的默认等级